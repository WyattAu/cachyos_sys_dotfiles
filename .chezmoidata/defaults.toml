# Template data for chezmoi (shared across all hosts)
# Per-host overrides go in ~/.config/chezmoi/chezmoi.toml on each machine

email = "wyatt_au@protonmail.com"
name = "WyattAu"
ghq_root = "~/dev/src"

# ProtonVPN defaults
vpn_protocol = "wireguard"        # wireguard | openvpn
vpn_killswitch = true             # Block traffic if VPN disconnects
vpn_split_tunneling = true        # Route only specified apps through VPN (can be toggled in GUI)
vpn_dns = true                    # Use ProtonVPN DNS (blocks ads/malware with NetShield)
vpn_auto_connect = false          # Connect on app launch (false = manual)
vpn_secure_core = false           # Route through privacy-friendly countries (slower)

# SSH defaults
truenas_ip = "192.168.1.3"
forgejo_ssh_host = "ssh.wyattau.com"
cloudflared_path = "~/.local/bin/cloudflared"

# OCIS
ocis_url = "https://ocis.wyattau.com"
ocis_sync_root = "~/ownCloud"

# Localization
system_locale = "en_GB.UTF-8"
system_timezone = "Asia/Hong_Kong"
user_dirs_locale = "en_GB"

# Backup
backup_mount_point = "/mnt/truebackup"

# KDE Plasma Defaults
is_laptop = false                    # Override per-host in ~/.config/chezmoi/chezmoi.toml [data] section
kde_color_scheme = "BreezeDark"
kde_icon_theme = "breeze-dark"
kde_widget_style = "Breeze"
kde_cursor_theme = "capitaine-cursors"
kde_cursor_size = 24
kde_animation_speed = 0.25
kde_contrast = 4
kde_panel_thickness = 42
kde_panel_floating = true
kde_tiling_enabled = true
kde_night_color_enabled = true
kde_night_color_temp = 4500
kde_compositor_backend = "wayland"
kde_font = "Noto Sans"
kde_font_size = 10
