name: System Tests

on:
  push:
    branches: [master]
    paths:
      - 'ansible/**'
      - 'tests/**'
      - 'flake.nix'
  pull_request:
    branches: [master]

jobs:
  nixos-tests:
    name: NixOS VM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run system tests
        run: |
          nix build ./tests#checks.x86_64-linux.system --print-build-logs

      - name: Run role tests
        run: |
          nix build ./tests#checks.x86_64-linux.roles --print-build-logs

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git ansible

      - uses: actions/checkout@v4

      - name: Ansible playbook syntax check
        run: |
          cd ansible
          ansible-playbook local.yml --syntax-check -i localhost,
