---
# =========================================================================
# OpenCode + MCP TOOLCHAIN
# =========================================================================
# Installs the OpenCode binary and the local MCP server backends. The
# OpenCode config itself (~/.config/opencode/) is managed by chezmoi.
#
# Layout produced for the MCP stack:
#   ~/.opencode/bin/opencode                  binary (official installer)
#   ~/.local/share/ghidra-mcp/                GhidraMCP bundle + staging
#   ~/.ghidra/.ghidra_*_PUBLIC/Extensions/    GhidraMCP Ghidra extension
#   ~/.local/share/radare2/r2pm/              r2pm-installed r2mcp
#   ~/.local/share/github-mcp/                github-mcp-server binary
#   ~/.cache/ms-playwright/                   Chromium for @playwright/mcp
#   bun cache                                 @playwright/mcp + filesystem MCP
#   docker: hashicorp/terraform-mcp-server    pre-pulled for the terraform MCP
#
# Update policy (per-host overrides in host_vars/<hostname>.yml):
#   opencode_self_update   re-run the official installer each sync
#   opencode_r2mcp_update  force r2pm rebuild of r2mcp each sync (slow)
#   GhidraMCP              auto-updates: re-downloads when upstream tag changes
#
# pacman deps (radare2, rizin, ghidra) are installed by the packages role
# from host_vars lists — this role assumes they are present.
# =========================================================================

# --- OpenCode binary (official installer, self-contained at ~/.opencode) ---
- name: Check OpenCode binary
  stat:
    path: "/home/{{ user }}/.opencode/bin/opencode"
  register: opencode_bin
  become: true
  become_user: "{{ user }}"

- name: Install OpenCode binary
  shell: curl -fsSL https://opencode.ai/install | bash
  when: not opencode_bin.stat.exists or opencode_self_update
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

# --- r2mcp: official radare2 MCP server (r2pm package) ---
# NOTE: r2pm -l exits 1 when nothing is installed yet — that's the
# "empty list" case, not an error, hence failed_when: false.
- name: List installed r2pm packages
  command: r2pm -l
  register: r2pm_list
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

- name: Install r2mcp (radare2 MCP server)
  command: r2pm -Uci r2mcp
  when: ("r2mcp" not in r2pm_list.stdout) or opencode_r2mcp_update
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

# --- Terraform MCP: pre-pull pinned image (registry lookups, read-only) ---
# Trivy scan 2026-10-17: HIGH/CRITICAL golang base CVEs (CVE-2026-78669
# net/http HTTP/2 DoS, CVE-2026-97031 TLS ECH DoS). Exposure is MINIMAL:
# the container is stdio-only (no published ports), so those network
# CVEs have no listener to attack. Re-scan when hashicorp republishes
# (latest == 1.3.0 as of this date — no patched build exists yet).
- name: Pre-pull Terraform MCP server image
  command: docker image pull {{ opencode_terraform_mcp_image }}
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user }}"

# --- github-mcp-server: official GitHub MCP server (stdio) ---
# Replaces the api.githubcopilot.com remote, which needs a Copilot
# entitlement and otherwise fails to authenticate. The token is read
# from the gh keyring at spawn time, so no secret is stored in dotfiles.
# Release resolution mirrors GhidraMCP: redirect + expanded-assets page
# (never the GitHub API — rate limits took the role down once).
- name: Read previously installed github-mcp-server asset name
  slurp:
    src: "/home/{{ user }}/.local/share/github-mcp/.resolved-asset"
  register: github_mcp_installed_file
  failed_when: false
  become: true
  become_user: "{{ user }}"

- name: Expose installed github-mcp-server asset name to later tasks
  set_fact:
    github_mcp_installed_key: "{{ github_mcp_installed_file.content | b64decode | trim }}"
  when: github_mcp_installed_file.content is defined

- name: Resolve github-mcp-server release tag (redirect - no API)
  shell: |
    set -euo pipefail
    curl -fsSLI -o /dev/null -w '%{url_effective}' \
      https://github.com/github/github-mcp-server/releases/latest | sed 's|.*/tag/||'
  register: github_mcp_latest_tag
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

- name: Resolve github-mcp-server asset URL (expanded assets page)
  shell: |
    set -euo pipefail
    TAG="{{ opencode_github_mcp_tag | default(github_mcp_latest_tag.stdout | trim, true) }}"
    curl -fsSL "https://github.com/github/github-mcp-server/releases/expanded_assets/$TAG" \
      | grep -oE 'href="[^"]*github-mcp-server_Linux_x86_64\.tar\.gz"' \
      | head -n1 | sed 's|href="|https://github.com|; s|"$||'
  register: github_mcp_asset
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

- name: Determine github-mcp-server asset name
  set_fact:
    github_mcp_asset_name: "{{ (github_mcp_asset.stdout | trim).split('/') | last }}"
  when: github_mcp_asset.stdout | trim | length > 0

- name: Install github-mcp-server binary (skipped when already current)
  unarchive:
    src: "{{ github_mcp_asset.stdout | trim }}"
    dest: "/home/{{ user }}/.local/share/github-mcp"
    remote_src: true
  when:
    - github_mcp_asset_name is defined
    - github_mcp_asset_name != github_mcp_installed_key | default('', true)
  register: github_mcp_installed

- name: Record installed github-mcp-server asset name
  copy:
    dest: "/home/{{ user }}/.local/share/github-mcp/.resolved-asset"
    content: "{{ github_mcp_asset_name }}\n"
    mode: "0644"
  when: github_mcp_asset_name is defined
  become: true
  become_user: "{{ user }}"

- name: Link github-mcp-server into PATH
  file:
    src: "/home/{{ user }}/.local/share/github-mcp/github-mcp-server"
    dest: "/home/{{ user }}/.local/bin/github-mcp-server"
    state: link
  become: true
  become_user: "{{ user }}"

# --- Reversecore_MCP: RE/malware analysis toolkit (uv tool) ---
# 151 tools over radare2 + r2ghidra + YARA + CAPA + LIEF + angr. The
# --python 3.12 pin is load-bearing (numpy has no wheel for this distro's
# default Python 3.14 and the meson build fails); lief + r2pipe are the
# two extras the server needs beyond the package (LIEF parsing, r2 IPC).
- name: Install Reversecore_MCP (uv tool, python 3.12)
  command: >
    uv tool install --python 3.12 reversecore-mcp
    --with lief --with r2pipe --force
  register: reversecore_install
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

# --- mcp-doctor: MCP fleet diagnostics (used advisory by sys-check) ---
- name: Resolve mcp-doctor release tag (redirect — no API)
  shell: |
    set -euo pipefail
    curl -fsSLI -o /dev/null -w '%{url_effective}' \
      https://github.com/WyattAu/mcp-doctor/releases/latest | sed 's|.*/tag/||'
  register: mcp_doctor_latest_tag
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

- name: Resolve mcp-doctor asset URL (expanded assets page)
  shell: |
    set -euo pipefail
    TAG="{{ opencode_mcp_doctor_tag | default(mcp_doctor_latest_tag.stdout | trim, true) }}"
    curl -fsSL "https://github.com/WyattAu/mcp-doctor/releases/expanded_assets/$TAG" \
      | grep -oE 'href="[^"]*mcp-doctor_v[^"]*_linux_x86_64\.tar\.gz"' \
      | head -n1 | sed 's|href="|https://github.com|; s|"$||'
  register: mcp_doctor_asset
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

- name: Determine mcp-doctor asset name
  set_fact:
    mcp_doctor_asset_name: "{{ (mcp_doctor_asset.stdout | trim).split('/') | last }}"
  when: mcp_doctor_asset.stdout | trim | length > 0

- name: Read previously installed mcp-doctor asset name
  slurp:
    src: "/home/{{ user }}/.local/share/mcp-doctor/.resolved-asset"
  register: mcp_doctor_installed_file
  failed_when: false
  become: true
  become_user: "{{ user }}"

- name: Expose installed mcp-doctor asset name to later tasks
  set_fact:
    mcp_doctor_installed_key: "{{ mcp_doctor_installed_file.content | b64decode | trim }}"
  when: mcp_doctor_installed_file.content is defined

- name: Ensure mcp-doctor directory exists
  file:
    path: "/home/{{ user }}/.local/share/mcp-doctor"
    state: directory
    mode: "0755"
  when: mcp_doctor_asset_name is defined
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

- name: Install mcp-doctor binary (skipped when already current)
  unarchive:
    src: "{{ mcp_doctor_asset.stdout | trim }}"
    dest: "/home/{{ user }}/.local/share/mcp-doctor"
    remote_src: true
  when:
    - mcp_doctor_asset_name is defined
    - mcp_doctor_asset_name != mcp_doctor_installed_key | default('', true)

- name: Record installed mcp-doctor asset name
  copy:
    dest: "/home/{{ user }}/.local/share/mcp-doctor/.resolved-asset"
    content: "{{ mcp_doctor_asset_name }}\n"
    mode: "0644"
  when: mcp_doctor_asset_name is defined
  become: true
  become_user: "{{ user }}"

- name: Link mcp-doctor into PATH
  file:
    src: "/home/{{ user }}/.local/share/mcp-doctor/mcp-doctor"
    dest: "/home/{{ user }}/.local/bin/mcp-doctor"
    state: link
  become: true
  become_user: "{{ user }}"

# --- Persistent global bun packages (replaces bunx cold starts) ---
# The flapping /home fs corrupted bunx's cache and broke module
# resolution for every bunx-spawned MCP server fleet-wide. Persistent
# global installs are immune: the binaries live in ~/.bun/bin.
- name: Install global bun MCP packages
  command: >
    bun add -g
    @modelcontextprotocol/server-sequential-thinking
    @modelcontextprotocol/server-filesystem
    @modelcontextprotocol/server-memory
    osint-mcp-server
    firecrawl-mcp
    exa-mcp-server
    @bytebase/dbhub
    @rubicontv/forgejo-mcp
    @burtthecoder/mcp-shodan
  register: bun_global_install
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

# --- GhidraMCP v2: Ghidra extension + ghidra-mcp CLI (uv tool) ---
# Release 2.0 restructured the bundle: the outer zip now contains a
# NESTED Ghidra extension zip (ghidra_<ver>_PUBLIC_*_GhidraMCP.zip) and
# a ghidra_mcp Python wheel. Both are consumed from a staging extract.
# A .resolved-tag marker re-downloads the bundle when upstream ships a
# new release; delete the marker to pin nothing (auto), or pin a URL
# via ghidramcp_plugin_url.
- name: Create ghidra-mcp data directory
  file:
    path: "/home/{{ user }}/.local/share/ghidra-mcp"
    state: directory
    mode: "0755"
    owner: "{{ user }}"
    group: "{{ user }}"
  become: true
  become_user: "{{ user }}"

- name: Read previously resolved GhidraMCP tag
  set_fact:
    ghidramcp_prev_tag: >-
      {{ lookup('ansible.builtin.file',
                '/home/' ~ user ~ '/.local/share/ghidra-mcp/.resolved-tag',
                errors='ignore') | default('', true) | trim }}

- name: Resolve latest GhidraMCP release tag (redirect — no API, rate-limit proof)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL -o /dev/null -w '%{url_effective}' \
      https://github.com/LaurieWired/GhidraMCP/releases/latest | sed 's|.*/tag/||'
  args:
    executable: /bin/bash
  register: ghidramcp_tag
  changed_when: false
  when: ghidramcp_plugin_url | length == 0

- name: Resolve GhidraMCP plugin asset URL (expanded assets page)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL "https://github.com/LaurieWired/GhidraMCP/releases/expanded_assets/{{ ghidramcp_tag.stdout | trim }}" \
      | grep -oE 'href="[^"]*GhidraMCP-[^"]*\.zip"' | head -n1 \
      | sed -E 's|^href="||; s|"$||; s|^/|https://github.com/|'
  args:
    executable: /bin/bash
  register: ghidramcp_asset
  changed_when: false
  when: ghidramcp_plugin_url | length == 0

- name: Determine whether GhidraMCP bundle must be re-downloaded
  set_fact:
    ghidramcp_force: >-
      {{ (ghidramcp_plugin_url | length > 0)
         or ((ghidramcp_prev_tag | trim)
             != (ghidramcp_tag.stdout | default('') | trim)) }}

- name: Download GhidraMCP plugin zip
  get_url:
    url: >-
      {{ ghidramcp_plugin_url if ghidramcp_plugin_url | length > 0
         else ghidramcp_asset.stdout }}
    dest: "/home/{{ user }}/.local/share/ghidra-mcp/GhidraMCP-plugin.zip"
    force: "{{ ghidramcp_force | bool }}"
    mode: "0644"
    owner: "{{ user }}"
    group: "{{ user }}"
  become: true
  become_user: "{{ user }}"

- name: Unpack GhidraMCP release bundle
  ansible.builtin.shell: |
    set -euo pipefail
    DATA="$HOME/.local/share/ghidra-mcp"
    STAGING="$DATA/staging"
    rm -rf "$STAGING"
    mkdir -p "$STAGING"
    unzip -oq "$DATA/GhidraMCP-plugin.zip" -d "$STAGING"
    echo "unpacked to $STAGING"
  args:
    executable: /bin/bash
  register: ghidramcp_unpack
  changed_when: "'unpacked' in ghidramcp_unpack.stdout"
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

- name: Read Ghidra version from install root
  # Case-insensitive: Ghidra <=11 used APPLICATION_VERSION=, 12.x uses
  # application.version=.
  command: "grep -iE '^application\\.version=' {{ ghidra_install_root }}/Ghidra/application.properties"
  register: ghidra_props
  failed_when: false
  changed_when: false

- name: Detect existing Ghidra user directories
  find:
    paths: "/home/{{ user }}/.ghidra"
    patterns: ".ghidra_*_PUBLIC"
    file_type: directory
  register: ghidra_user_dirs
  failed_when: false

- name: Determine Ghidra user directory
  set_fact:
    ghidra_user_dir: >-
      {{ (ghidra_user_dirs.files | map(attribute='path') | sort | last)
         if (ghidra_user_dirs.files | default([])) | length > 0
         else ('/home/' ~ user ~ '/.ghidra/.ghidra_'
               ~ (ghidra_props.stdout | regex_replace('^[^=]*=', '') | trim)
               ~ '_PUBLIC') }}
  when: (ghidra_user_dirs.files | default([])) | length > 0
        or (ghidra_props.stdout | default('')) | length > 0

- name: Install GhidraMCP extension into Ghidra
  ansible.builtin.shell: |
    set -euo pipefail
    STAGING="$HOME/.local/share/ghidra-mcp/staging"
    INNER="$(find "$STAGING" -maxdepth 3 -name 'ghidra_*_GhidraMCP*.zip' | head -n1)"
    if [ -z "$INNER" ]; then
      echo "ERROR: no nested Ghidra extension zip found in release bundle" >&2
      exit 1
    fi
    DEST="{{ ghidra_user_dir }}/Extensions"
    rm -rf "$DEST/GhidraMCP"
    mkdir -p "$DEST"
    unzip -oq "$INNER" -d "$DEST"
    if [ ! -f "$DEST/GhidraMCP/extension.properties" ]; then
      echo "ERROR: extracted extension has no extension.properties" >&2
      exit 1
    fi
    echo "Installed $(basename "$INNER") -> $DEST/GhidraMCP"
  args:
    executable: /bin/bash
  register: ghidramcp_install
  changed_when: "'Installed' in ghidramcp_install.stdout"
  when: ghidra_user_dir is defined
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

- name: Check GhidraMCP extension version against installed Ghidra
  ansible.builtin.shell: |
    set -o pipefail
    EXT_VER="$(grep -iE '^version=' '{{ ghidra_user_dir }}/Extensions/GhidraMCP/extension.properties' | cut -d= -f2)"
    GHIDRA_VER="$(grep -iE '^application\.version=' {{ ghidra_install_root }}/Ghidra/application.properties | cut -d= -f2)"
    if [ "$EXT_VER" != "$GHIDRA_VER" ]; then
      echo "MISMATCH extension=$EXT_VER ghidra=$GHIDRA_VER"
    else
      echo "OK $EXT_VER"
    fi
  args:
    executable: /bin/bash
  register: ghidramcp_version_check
  changed_when: false
  failed_when: false
  when: ghidra_user_dir is defined
  become: true
  become_user: "{{ user }}"

- name: Warn on GhidraMCP/Ghidra version mismatch
  debug:
    msg: >-
      GhidraMCP extension and Ghidra versions differ
      ({{ ghidramcp_version_check.stdout }}). Ghidra usually accepts minor
      mismatches with a warning; if the extension fails to load, wait for
      the Arch ghidra package to catch up or pin a matching GhidraMCP
      release via ghidramcp_plugin_url.
  when:
    - ghidra_user_dir is defined
    - ghidramcp_version_check.stdout is defined
    - "'MISMATCH' in ghidramcp_version_check.stdout"

- name: Install ghidra-mcp CLI (uv tool from release wheel)
  ansible.builtin.shell: |
    set -euo pipefail
    WHEEL="$(find "$HOME/.local/share/ghidra-mcp/staging" -name 'ghidra_mcp-*-py3-none-any.whl' | head -n1)"
    if [ -z "$WHEEL" ]; then
      echo "ERROR: ghidra_mcp wheel not found in release bundle" >&2
      exit 1
    fi
    uv tool install --force "$WHEEL"
  args:
    executable: /bin/bash
  changed_when: false
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"
    PATH: "/home/{{ user }}/.local/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin') }}"

- name: Record resolved GhidraMCP tag
  copy:
    content: "{{ ghidramcp_tag.stdout | trim }}\n"
    dest: "/home/{{ user }}/.local/share/ghidra-mcp/.resolved-tag"
    mode: "0644"
    owner: "{{ user }}"
    group: "{{ user }}"
  when: ghidramcp_plugin_url | length == 0
  become: true
  become_user: "{{ user }}"

# --- Playwright: persistent @playwright/mcp install (MCP server) ---
# A REAL node_modules (not the bunx temp cache) so playwright-core
# module resolution works; the OpenCode MCP config points node at this
# package's cli.js with --browser chromium.
- name: Persistent @playwright/mcp install
  shell: |
    mkdir -p /home/{{ user }}/.local/share/opencode/mcp-playwright
    cd /home/{{ user }}/.local/share/opencode/mcp-playwright
    bun add @playwright/mcp@latest
  args:
    executable: /bin/bash
    creates: "/home/{{ user }}/.local/share/opencode/mcp-playwright/node_modules/@playwright/mcp/package.json"
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

# --- Playwright: Chromium for @playwright/mcp ---
# bunx, not npx: the fleet has bun (common_packages) but no npm/npx.
- name: Install Playwright Chromium (cached in ~/.cache/ms-playwright)
  command: bunx playwright@latest install chromium
  args:
    creates: "/home/{{ user }}/.cache/ms-playwright"
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "/home/{{ user }}"

# --- Post-install verification -------------------------------------------
- name: Re-stat OpenCode binary
  stat:
    path: "/home/{{ user }}/.opencode/bin/opencode"
  register: opencode_bin_post
  become: true
  become_user: "{{ user }}"

- name: Verify OpenCode toolchain
  vars:
    r2mcp_ok: "{{ ('r2mcp' in r2pm_list.stdout) or opencode_r2mcp_update }}"
  ansible.builtin.assert:
    that:
      - opencode_bin_post.stat.exists
      - r2mcp_ok
      - ghidra_user_dir is not defined or not ghidramcp_install is skipped
      - github_mcp_asset_name is not defined or github_mcp_asset.stdout | trim | length > 0
      - reversecore_install is not skipped
    fail_msg: >-
      OpenCode toolchain incomplete — check the failed tasks above.
      Common causes: radare2/rizin/ghidra missing from the packages role,
      no network to github.com, or docker not running on this host.
    success_msg: "OpenCode toolchain verified: binary, r2mcp, GhidraMCP extension, github-mcp-server."
  become: true
  become_user: "{{ user }}"
