---
# OpenCode role defaults — paths relative to the target user's home.
# Override any of these per-host in host_vars/<hostname>.yml.

# GhidraMCP plugin zip URL. Empty = resolve the latest release asset
# from the GitHub API at run time. Pin a URL here to freeze a version:
#   ghidramcp_plugin_url: "https://github.com/LaurieWired/GhidraMCP/releases/download/v1.4.0/GhidraMCP-1.4.0.zip"
# Delete ~/.local/share/ghidra-mcp/GhidraMCP-plugin.zip on a host to
# re-resolve the latest release on the next run.
ghidramcp_plugin_url: ""

# Bridge script (MCP stdio <-> Ghidra HTTP) fetched from the repo main branch.
ghidramcp_bridge_url: "https://raw.githubusercontent.com/LaurieWired/GhidraMCP/main/bridge_mcp_ghidra.py"

# Ghidra install root used by the AUR package.
ghidra_install_root: "/opt/ghidra"
