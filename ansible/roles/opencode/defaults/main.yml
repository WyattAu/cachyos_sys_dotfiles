---
# OpenCode role defaults — paths relative to the target user's home.
# Override any of these per-host in host_vars/<hostname>.yml.

# GhidraMCP plugin zip URL. Empty = resolve the latest release asset
# from GitHub (no API — redirect + expanded assets page, rate-limit proof).
# Pin a URL here to freeze a version:
#   ghidramcp_plugin_url: "https://github.com/LaurieWired/GhidraMCP/releases/download/2.0/GhidraMCP-release-2-0.zip"
# Delete ~/.local/share/ghidra-mcp/GhidraMCP-plugin.zip on a host to
# re-resolve the latest release on the next run.
ghidramcp_plugin_url: ""

# Ghidra install root used by the Arch/CachyOS package.
ghidra_install_root: "/opt/ghidra"
