global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 10s

  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['localhost:8428']
    scrape_interval: 30s

  - job_name: 'vault'
    metrics_path: /v1/sys/metrics
    params:
      format: ['prometheus']
    static_configs:
      - targets: ['localhost:8200']
    scrape_interval: 30s
