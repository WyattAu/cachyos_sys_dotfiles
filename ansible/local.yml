---
# =========================================================================
# CACHYOS / ARCH MULTI-HOST PLAYBOOK
# =========================================================================
# Variable loading order (4-layer inheritance):
#   Layer 1: common.yml           — ALL systems (WSL + Native)
#   Layer 2: arch_native.yml      — All bare-metal Linux (Arch + CachyOS)
#   Layer 2b: arch_only.yml       — Vanilla Arch only (conflicts with CachyOS)
#   Layer 2c: cachyos.yml         — CachyOS only (optimized additions)
#   Layer 3: <hostname>.yml       — Device-specific overrides
#
# Roles:
#   packages    — Chaotic-AUR, pacman sync, AUR upgrade/install, flatpak
#   toolchains  — Nix, Rust, Elan, direnv, pnpm
#   directories — Dev/personal/SSH dirs, Steam symlink, GHQ config
#   hardware    — MSI audio, msi-ec module blacklisting
#   system      — Groups, services, PipeWire, SDDM, KDE, fonts, security, snapper
#   vault       — HashiCorp Vault auto-unseal
#   monitoring  — VictoriaMetrics, alertmanager, vmagent
#   containers  — Docker/Portainer
#   performance — sysctl, CPU governor, SCX, NVMe, kernel params, huge pages
# =========================================================================

- hosts: localhost
  connection: local
  become: true

  vars:
    user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    is_headless: false
    arch_only_packages: []
    arch_only_aur_pkgs: []
    arch_only_services: []
    cachyos_packages: []
    cachyos_aur_pkgs: []
    cachyos_services: []
    host_packages: []
    host_aur_pkgs: []
    host_services: []
    native_desktop_packages: []
    native_desktop_aur_pkgs: []
    native_gaming_packages: []
    native_gaming_aur_pkgs: []
    is_headless: false
    masked_services: []
    dev_structure: []
    personal_structure: []
    ssh_structure: []

  tasks:
    # ================================================================
    # 1. ENVIRONMENT DETECTION
    # ================================================================
    - name: Detect WSL
      set_fact:
        is_wsl: "{{ 'microsoft' in (ansible_facts['kernel'] | default('')) }}"

    - name: Detect CachyOS
      ansible.builtin.shell: . /etc/os-release && echo "$ID"
      register: os_id
      changed_when: false

    - name: Set distro facts
      set_fact:
        is_cachyos: "{{ 'cachyos' in os_id.stdout }}"

    - name: Display environment
      debug:
        msg: >-
          Host={{ ansible_facts['hostname'] }}
          WSL={{ is_wsl }}
          CachyOS={{ is_cachyos }}
          Kernel={{ ansible_facts['kernel'] }}

    # ================================================================
    # 2. LOAD VARIABLES (4-layer inheritance)
    # ================================================================
    - name: "Layer 1: Load common variables (all systems)"
      include_vars:
        file: host_vars/common.yml

    - name: "Layer 2: Load native Linux variables (skip WSL)"
      include_vars:
        file: host_vars/arch_native.yml
      when: not is_wsl

    - name: "Layer 2b: Load Arch-only variables (skip CachyOS and WSL)"
      include_vars:
        file: host_vars/arch_only.yml
      when:
        - not is_cachyos
        - not is_wsl

    - name: "Layer 2c: Load CachyOS-specific variables"
      include_vars:
        file: host_vars/cachyos.yml
      when:
        - is_cachyos
        - not is_wsl

    - name: "Layer 3: Load host-specific overrides"
      include_vars:
        file: "host_vars/{{ ansible_facts['hostname'] }}.yml"
      failed_when: false

    # ================================================================
    # 3. AUTOMATION & MAINTENANCE (native only)
    # ================================================================
    - name: Create Auto-Update Service
      copy:
        dest: /etc/systemd/system/auto-sys-sync.service
        content: |
          [Unit]
          Description=Background System Sync
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          User={{ user }}
          Environment=HOME=/home/{{ user }}
          ExecStart=/home/{{ user }}/.local/share/chezmoi/scripts/sys-sync
      when: not is_wsl

    - name: Create Auto-Update Timer
      copy:
        dest: /etc/systemd/system/auto-sys-sync.timer
        content: |
          [Unit]
          Description=Run sys-sync 15min after boot and daily
          [Timer]
          OnBootSec=15min
          OnUnitActiveSec=1d
          Persistent=true
          [Install]
          WantedBy=timers.target
      when: not is_wsl

    - name: Enable Auto-Update Timer
      systemd:
        name: auto-sys-sync.timer
        enabled: yes
        state: started
      when: not is_wsl

    # ================================================================
    # 4-17. ROLES
    # ================================================================
    - include_role:
        name: packages

    - include_role:
        name: toolchains

    - include_role:
        name: directories

    - include_role:
        name: hardware

    - include_role:
        name: system

    - include_role:
        name: vault

    - include_role:
        name: monitoring

    - include_role:
        name: containers

    - include_role:
        name: performance

  # ================================================================
  # HANDLERS
  # ================================================================
  handlers:
    - name: Restart NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted

    - name: Reload sysctl
      ansible.builtin.shell: sysctl --system
      changed_when: false

    - name: Reload udev
      ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger
      changed_when: false

    - name: Restart nix-daemon
      ansible.builtin.systemd:
        name: nix-daemon
        state: restarted

    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted

    - name: Restart NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted
