---
# =========================================================================
# CACHYOS / ARCH MULTI-HOST PLAYBOOK
# =========================================================================
# Variable loading order (4-layer inheritance):
#   Layer 1: common.yml           — ALL systems (WSL + Native)
#   Layer 2: arch_native.yml      — All bare-metal Linux (Arch + CachyOS)
#   Layer 2b: arch_only.yml       — Vanilla Arch only (conflicts with CachyOS)
#   Layer 2c: cachyos.yml         — CachyOS only (optimized additions)
#   Layer 3: <hostname>.yml       — Device-specific overrides
# =========================================================================

- hosts: localhost
  connection: local
  become: true

  vars:
    user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    arch_only_packages: []
    arch_only_aur_pkgs: []
    arch_only_services: []
    cachyos_packages: []
    cachyos_aur_pkgs: []
    cachyos_services: []
    host_packages: []
    host_aur_pkgs: []
    host_services: []
    masked_services: []
    dev_structure: []
    personal_structure: []
    ssh_structure: []

  tasks:
    # ================================================================
    # 1. ENVIRONMENT DETECTION
    # ================================================================
    - name: Detect WSL
      set_fact:
        is_wsl: "{{ 'microsoft' in (ansible_facts['kernel'] | default('')) }}"

    - name: Detect CachyOS
      ansible.builtin.shell: . /etc/os-release && echo "$ID"
      register: os_id
      changed_when: false

    - name: Set distro facts
      set_fact:
        is_cachyos: "{{ 'cachyos' in os_id.stdout }}"

    - name: Display environment
      debug:
        msg: >-
          Host={{ ansible_facts['hostname'] }}
          WSL={{ is_wsl }}
          CachyOS={{ is_cachyos }}
          Kernel={{ ansible_facts['kernel'] }}

    # ================================================================
    # 2. LOAD VARIABLES (4-layer inheritance)
    # ================================================================
    - name: "Layer 1: Load common variables (all systems)"
      include_vars:
        file: host_vars/common.yml

    - name: "Layer 2: Load native Linux variables (skip WSL)"
      include_vars:
        file: host_vars/arch_native.yml
      when: not is_wsl

    - name: "Layer 2b: Load Arch-only variables (skip CachyOS and WSL)"
      include_vars:
        file: host_vars/arch_only.yml
      when:
        - not is_cachyos
        - not is_wsl

    - name: "Layer 2c: Load CachyOS-specific variables"
      include_vars:
        file: host_vars/cachyos.yml
      when:
        - is_cachyos
        - not is_wsl

    - name: "Layer 3: Load host-specific overrides"
      include_vars:
        file: "host_vars/{{ ansible_facts['hostname'] }}.yml"
      failed_when: false

    # ================================================================
    # 3. AUTOMATION & MAINTENANCE (native only)
    # ================================================================
    - name: Create Auto-Update Service
      copy:
        dest: /etc/systemd/system/auto-sys-sync.service
        content: |
          [Unit]
          Description=Background System Sync
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          User={{ user }}
          Environment=HOME=/home/{{ user }}
          ExecStart=/home/{{ user }}/.local/share/chezmoi/scripts/sys-sync
      when: not is_wsl

    - name: Create Auto-Update Timer
      copy:
        dest: /etc/systemd/system/auto-sys-sync.timer
        content: |
          [Unit]
          Description=Run sys-sync 15min after boot and daily
          [Timer]
          OnBootSec=15min
          OnUnitActiveSec=1d
          Persistent=true
          [Install]
          WantedBy=timers.target
      when: not is_wsl

    - name: Enable Auto-Update Timer
      systemd:
        name: auto-sys-sync.timer
        enabled: yes
        state: started
      when: not is_wsl

    # ================================================================
    # 4. PRIVILEGE & SYSTEM UPDATES
    # ================================================================
    - name: Allow 'pacman' to run without password
      lineinfile:
        path: /etc/sudoers.d/11-ansible-pacman
        line: "{{ user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
        create: yes
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Add Chaotic-AUR keyring
      ansible.builtin.shell: |
        pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
        pacman-key --lsign-key 3056513887B78AEB
      changed_when: false

    - name: Add Chaotic-AUR repository
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        block: |
          [chaotic-aur]
          Include = /etc/pacman.d/chaotic-mirrorlist
        marker: "# {mark} ANSIBLE MANAGED: Chaotic-AUR"

    - name: Install Chaotic-AUR keyring and mirrorlist
      ansible.builtin.shell: |
        if ! pacman -Q chaotic-keyring >/dev/null 2>&1; then
          TMPDIR=$(mktemp -d)
          curl -fsSL -o "$TMPDIR/chaotic-keyring.pkg.tar.zst" \
            https://builds.garudalinux.org/repos/chaotic-aur/chaotic-keyring.pkg.tar.zst
          curl -fsSL -o "$TMPDIR/chaotic-mirrorlist.pkg.tar.zst" \
            https://builds.garudalinux.org/repos/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst
          pacman -U --noconfirm "$TMPDIR/chaotic-keyring.pkg.tar.zst" "$TMPDIR/chaotic-mirrorlist.pkg.tar.zst"
          rm -rf "$TMPDIR"
          echo "INSTALLED"
        else
          echo "ALREADY_INSTALLED"
        fi
      register: chaotic_install
      changed_when: "'INSTALLED' in chaotic_install.stdout"

    - name: Update System Repos
      community.general.pacman:
        update_cache: yes
        upgrade: yes
      # AUDIT-KEEP: repo transitions declare replaces/conflicts (e.g.
      # python-proton-vpn-api-core replacing python-proton-vpn-local-agent);
      # the module's --noconfirm answers the default N to conflict prompts
      # and aborts. The retry below accepts the repo's own conflict resolution.
      ignore_errors: yes
      register: sysupgrade

    - name: Resolve package conflicts and complete upgrade (repo transitions)
      # Only runs when the module-based upgrade failed. `yes |` accepts the
      # conflict prompts; if the upgrade still fails, the play fails here.
      ansible.builtin.shell: set -o pipefail; yes | pacman -Syu
      when: sysupgrade is failed
      changed_when: true

    - name: Ensure /var/tmp/aur_build directory exists
      ansible.builtin.file:
        path: /var/tmp/aur_build
        state: directory
        mode: "0755"
        owner: "{{ user }}"
        group: "{{ user }}"

    - name: Create temporary swap via loop device (btrfs-compatible)
      ansible.builtin.shell:
        cmd: |
          if ! swapon --show=NAME --noheadings | grep -q '/dev/loop'; then
            swapoff /dev/loop0 2>/dev/null || true
            losetup -d /dev/loop0 2>/dev/null || true
            rm -f /var/tmp/aur_build_swap.img
            truncate -s 8G /var/tmp/aur_build_swap.img
            losetup /dev/loop0 /var/tmp/aur_build_swap.img
            mkswap /dev/loop0
            swapon /dev/loop0
            echo "Loop swap active on /dev/loop0"
          else
            echo "Swap already active"
          fi
      changed_when: false

    - name: Upgrade AUR Packages
      kewlfft.aur.aur:
        upgrade: yes
        use: paru
        aur_only: yes
        extra_args: "--clonedir /var/tmp/aur_build --builddir /var/tmp/aur_build"
      become: true
      become_user: "{{ user }}"
      # AUDIT-KEEP: AUR builds are flake-tolerant (network, upstream breakage).
      # Failures are surfaced in the summary below instead of failing the run.
      ignore_errors: true
      register: aur_upgrade
      environment:
        MAKEFLAGS: "-j4"
        NINJAFLAGS: "-j4"

    # ================================================================
    # 5. PACKAGE INSTALLATION (merged from all layers)
    # ================================================================
    - name: Remove packages superseded by repo transitions or native repos
      community.general.pacman:
        name:
          - heroic-games-launcher-bin
          # merged into python-proton-vpn-api-core 5.5.15+
          - python-proton-vpn-local-agent
        state: absent
      # AUDIT-KEEP: absent is idempotent, but package may be foreign/partial on fresh hosts
      ignore_errors: true

    - name: Install System Packages
      community.general.pacman:
        name: >-
          {{ common_packages
           + (native_packages | default([]))
           + (arch_only_packages | default([]))
           + (cachyos_packages | default([]))
           + (host_packages | default([])) }}
        state: present

    - name: Install AUR Packages (one at a time to avoid OOM)
      kewlfft.aur.aur:
        name: "{{ item }}"
        use: paru
        extra_args: "--clonedir /var/tmp/aur_build --builddir /var/tmp/aur_build"
      become: true
      become_user: "{{ user }}"
      # AUDIT-KEEP: individual AUR builds may fail upstream; rest must proceed.
      # Failed items are listed in the summary task below.
      ignore_errors: true
      register: aur_install
      environment:
        MAKEFLAGS: "-j4"
        NINJAFLAGS: "-j4"
      loop: >-
        {{ common_aur_pkgs
         + (native_aur_pkgs | default([]))
          + (arch_only_aur_pkgs | default([]))
          + (cachyos_aur_pkgs | default([]))
          + (host_aur_pkgs | default([])) }}

    - name: Surface failed AUR builds
      ansible.builtin.debug:
        msg: >-
          {{ 'WARNING — failed AUR packages: '
             ~ (aur_install.results
                | selectattr('failed', 'equalto', true)
                | map(attribute='item')
                | list)
             if (aur_install.results | selectattr('failed', 'equalto', true) | list | length > 0)
             else 'All AUR packages built successfully.' }}

    - name: Remove temporary swap (loop device)
      ansible.builtin.shell:
        cmd: |
          if swapon --show=NAME --noheadings | grep -q '/dev/loop'; then
            swapoff /dev/loop0 2>/dev/null || true
            losetup -d /dev/loop0 2>/dev/null || true
            rm -f /var/tmp/aur_build_swap.img
            echo "Swap removed"
          fi
      changed_when: false

    - name: Ensure Flathub remote is configured
      ansible.builtin.shell: >
        flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      changed_when: false

    # ================================================================
    # 6. MANAGEMENT SCRIPTS
    # ================================================================
    - name: Ensure management scripts are executable
      file:
        path: "/home/{{ user }}/.local/share/chezmoi/scripts/{{ item }}"
        mode: "0755"
        owner: "{{ user }}"
        group: "{{ user }}"
      loop:
        - sys-save
        - sys-sync
        - bootstrap.sh

    - name: Ensure ~/.local/bin directory exists
      file:
        path: "/home/{{ user }}/.local/bin"
        state: directory
        mode: "0755"
        owner: "{{ user }}"
        group: "{{ user }}"

    - name: Symlink scripts to ~/.local/bin for system-wide PATH access
      file:
        src: "/home/{{ user }}/.local/share/chezmoi/scripts/{{ item }}"
        dest: "/home/{{ user }}/.local/bin/{{ item }}"
        state: link
        owner: "{{ user }}"
        group: "{{ user }}"
        force: true
      loop:
        - sys-save
        - sys-sync
        - sys-check
        - sys-monitor.sh
        - vault-init.sh
        - vault-store.sh
        - vault-unseal.sh
        - vault-backup.sh
        - vm-setup.sh
        - mic-lock.sh

    # ================================================================
    # 7. TOOLCHAINS (installed as the actual user, NOT root)
    # ================================================================
    - name: Initialize Nix (multi-user install)
      # Uses the official Determinate Systems installer — idempotent.
      # Installs Nix daemon, creates /nix/store, adds nix-daemon service.
      # Runs as root; after install, user is configured via nix.conf.
      shell: >
        curl -L https://nixos.org/nix/install 2>/dev/null |
        sh -s -- --daemon --yes
      args:
        creates: "/nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh"
      when: not is_wsl

    - name: Configure Nix experimental features
      ansible.builtin.lineinfile:
        path: /etc/nix/nix.conf
        regexp: '^experimental-features'
        line: 'experimental-features = nix-command flakes'
        create: yes
        mode: "0644"
      when: not is_wsl
      notify: Restart nix-daemon

    - name: Configure Nix trusted users
      ansible.builtin.lineinfile:
        path: /etc/nix/nix.conf
        regexp: '^trusted-users'
        line: 'trusted-users = root {{ user }}'
        create: yes
        mode: "0644"
      when: not is_wsl
      notify: Restart nix-daemon

    - name: Enable nix-daemon service
      systemd:
        name: nix-daemon
        enabled: yes
        state: started
        daemon_reload: yes
      when: not is_wsl
      # AUDIT-KEEP: nix may not be installed yet on first run (installer task
      # above may have been skipped); enable succeeds on the next sys-sync.
      ignore_errors: yes

    - name: Initialize Global Rust Toolchain
      command: rustup default stable
      args:
        creates: "/home/{{ user }}/.cargo/bin/cargo"
      become: true
      become_user: "{{ user }}"

    - name: Initialize Elan (Lean 4)
      shell: "curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y"
      args:
        creates: "/home/{{ user }}/.elan/bin/lean"
      become: true
      become_user: "{{ user }}"

    - name: Install nix-direnv (fast cached 'use flake')
      command: /nix/var/nix/profiles/default/bin/nix profile install nixpkgs#nix-direnv
      args:
        creates: "/home/{{ user }}/.local/state/nix/profiles/profile-1-link"
      become: true
      become_user: "{{ user }}"
      when: not is_wsl
      ignore_errors: yes  # AUDIT-KEEP: absent until nix installer ran (first run)
      environment:
        XDG_STATE_HOME: "/home/{{ user }}/.local/state"

    - name: Install global npm packages (pnpm)
      # Idempotent no-op when the version is already present; picks up
      # upstream releases on each sync. pnpm ships with nodejs-lts.
      command: pnpm add -g {{ item }}
      become: true
      become_user: "{{ user }}"
      changed_when: false
      loop: "{{ pnpm_global_pkgs | default([]) }}"
      environment:
        PNPM_HOME: "/home/{{ user }}/.local/share/pnpm"
        PATH: "/home/{{ user }}/.local/share/pnpm/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl') }}"

    # ================================================================
    # 8. DETERMINISTIC DIRECTORY MANAGEMENT
    # ================================================================
    - name: Ensure Dev Directory Structure Exists
      file:
        path: "/home/{{ user }}/{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ user }}"
        group: "{{ user }}"
      loop: "{{ dev_structure | default([]) }}"

    - name: Ensure Personal Directory Structure Exists
      file:
        path: "/home/{{ user }}/{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ user }}"
        group: "{{ user }}"
      loop: "{{ personal_structure | default([]) }}"

    - name: Create SSH directories
      file:
        path: "/home/{{ user }}/{{ item }}"
        state: directory
        mode: "0700"
        owner: "{{ user }}"
        group: "{{ user }}"
      loop: "{{ ssh_structure | default([]) }}"

    - name: Create Steam Symlink (Games/Steam -> ~/.local/share/Steam)
      file:
        src: "/home/{{ user }}/.local/share/Steam"
        dest: "/home/{{ user }}/Games/Steam"
        state: link
        owner: "{{ user }}"
        force: true

    - name: Configure GHQ Root Directory in Git
      git_config:
        name: ghq.root
        scope: global
        value: "{{ ghq_root | default('~/dev/src') }}"
      become: true
      become_user: "{{ user }}"

    # ================================================================
    # 9. HOST-SPECIFIC HARDWARE FIXES
    # NOTE: Runs BEFORE service enablement so unit files exist.
    # ================================================================

    # --- MSI Hardware Fixes: Audio, msi-ec, module blacklisting ---
    - block:
        - name: Create MSI Audio Fix Script
          copy:
            dest: /usr/local/bin/msi-audio-fix.sh
            mode: "0755"
            content: |
              #!/bin/bash
              hda-verb /dev/snd/hwC0D0 0x17 SET_CONNECT_SEL 0x01
              hda-verb /dev/snd/hwC0D0 0x17 SET_PIN_WIDGET_CONTROL 0x40
              hda-verb /dev/snd/hwC0D0 0x1a SET_AMP_GAIN_MUTE 0xb000
              hda-verb /dev/snd/hwC0D0 0x1a SET_PIN_WIDGET_CONTROL 0x40

        - name: Create MSI Audio systemd Unit
          copy:
            dest: /etc/systemd/system/msi-audio.service
            content: |
              [Unit]
              Description=Fix MSI Woofers
              After=sound.target
              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/msi-audio-fix.sh
              [Install]
              WantedBy=multi-user.target

        - name: Reload systemd for new MSI units
          systemd:
            daemon_reload: yes

        - name: Blacklist conflicting modules (msi_wmi vs msi-ec)
          ansible.builtin.lineinfile:
            path: "/etc/modprobe.d/{{ ansible_facts['hostname'] }}.conf"
            line: "blacklist {{ item }}"
            create: yes
            mode: "0644"
          loop: "{{ blacklisted_modules | default([]) }}"

        - name: Load required modules at boot
          ansible.builtin.lineinfile:
            path: "/etc/modules-load.d/{{ ansible_facts['hostname'] }}.conf"
            line: "{{ item }}"
            create: yes
            mode: "0644"
          loop: "{{ loaded_modules | default([]) }}"

        - name: Unload conflicting msi_wmi and load msi-ec
          ansible.builtin.shell: |
            modprobe -r msi_wmi_platform 2>/dev/null || true
            modprobe -r msi_wmi 2>/dev/null || true
            modprobe msi-ec 2>/dev/null || true
          changed_when: false
      when: blacklisted_modules is defined and blacklisted_modules | length > 0

    # ================================================================
    # 10. NATIVE SYSTEM CONFIGURATION (groups, services, audio)
    # ================================================================
    - block:
        - name: Ensure User Groups Exist
          group:
            name: "{{ item }}"
            state: present
          loop: [docker, libvirt, gamemode, input, video]

        - name: Add User to Groups
          user:
            name: "{{ user }}"
            groups: docker,libvirt,gamemode,input,video
            append: yes

        # AUDIT-KEEP (x5, service loops): layer lists are shared across hosts
        # with different hardware — e.g. msi-audio only exists on MSI laptops.
        # A missing unit on one host must not abort the whole sync.
        - name: Enable Common Services (Layer 1)
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop: "{{ common_services | default([]) }}"
          ignore_errors: yes

        - name: Enable Native Services (Layer 2)
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop: "{{ native_services | default([]) }}"
          ignore_errors: yes

        - name: Enable Arch-Only Services (Layer 2b)
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop: "{{ arch_only_services | default([]) }}"
          ignore_errors: yes

        - name: Enable CachyOS Services (Layer 2c)
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop: "{{ cachyos_services | default([]) }}"
          ignore_errors: yes

        - name: Enable Host-Specific Services (Layer 3)
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
            daemon_reload: yes
          loop: "{{ host_services | default([]) }}"
          ignore_errors: yes

        - name: Mask Unwanted Services
          systemd:
            name: "{{ item }}"
            masked: yes
          loop: "{{ masked_services | default([]) }}"

        - name: Optimize PipeWire for High-End Audio
          copy:
            dest: /etc/pipewire/pipewire.conf.d/99-custom-audio.conf
            content: |
              context.properties = {
              # Force high-quality resampling
              default.clock.rate = 48000
              default.clock.allowed-rates = [ 44100, 48000, 88200, 96000 ]
              # Increase buffer size to prevent distortion/crackling
              default.clock.min-quantum = 1024
              default.clock.max-quantum = 2048
              }
      when: not is_wsl

    # ================================================================
    # 10a. SYSTEM-LEVEL KDE CONFIGURATION (native only)
    # ================================================================
    - block:
        - name: Create SDDM config directory
          ansible.builtin.file:
            path: /etc/sddm.conf.d
            state: directory
            mode: "0755"

        - name: Set SDDM theme
          ansible.builtin.copy:
            dest: /etc/sddm.conf.d/theme.conf
            content: |
              [Theme]
              Current=breeze
            mode: "0644"
            force: false

        - name: Set system-wide cursor theme
          ansible.builtin.copy:
            dest: /usr/share/icons/default/index.theme
            content: |
              [Icon Theme]
              Name=Default
              Comment=Default Cursor Theme
              Inherits=capitaine-cursors
            mode: "0644"

        - name: Create /etc/environment.d directory
          ansible.builtin.file:
            path: /etc/environment.d
            state: directory
            mode: "0755"

        - name: Create /etc/xdg-desktop-portal directory
          ansible.builtin.file:
            path: /etc/xdg-desktop-portal
            state: directory
            mode: "0755"

        - name: Create Qt/Wayland environment config
          ansible.builtin.copy:
            dest: /etc/environment.d/kde-wayland.conf
            content: |
              QT_QPA_PLATFORMTHEME=wayland
              QT_AUTO_SCREEN_SCALE_FACTOR=1
              XDG_CURRENT_DESKTOP=KDE
            mode: "0644"

        - name: Set KDE portal preferences
          ansible.builtin.copy:
            dest: /etc/xdg-desktop-portal/kde-portals.conf
            content: |
              [preferred]
              default=kde
              org.freedesktop.impl.portal.Settings=kde
              org.freedesktop.impl.portal.Secret=kwallet
              org.freedesktop.impl.portal.Notification=plasmanotify
            mode: "0644"
      when: not is_wsl

    # ================================================================
    # 10c. SECURITY, FONTS & MAINTENANCE (native only)
    # ================================================================
    - block:
        - name: Install comprehensive font packages
          community.general.pacman:
            name:
              - noto-fonts
              - noto-fonts-cjk
              - noto-fonts-emoji
            state: present

        - name: Install pika-backup
          community.general.pacman:
            name: pika-backup
            state: present

        - name: Install fail2ban
          community.general.pacman:
            name: fail2ban
            state: present

        - name: Enable fail2ban
          systemd:
            name: fail2ban
            enabled: yes
            state: started

        - name: Disable SSH password authentication
          ansible.builtin.lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?PasswordAuthentication'
            line: 'PasswordAuthentication no'
          notify: Restart sshd

        - name: Disable SSH root login
          ansible.builtin.lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?PermitRootLogin'
            line: 'PermitRootLogin no'
          notify: Restart sshd

        # Fleet access: authorize workstation pubkeys for the local user
        # (managed block — removing a key here removes it on next sync).
        - name: Ensure workstation SSH keys are authorized
          ansible.builtin.blockinfile:
            path: "/home/{{ user }}/.ssh/authorized_keys"
            block: "{{ ssh_authorized_keys | default([]) | join('\n') }}"
            marker: "# {mark} ANSIBLE MANAGED: workstation keys"
            create: yes
            owner: "{{ user }}"
            group: "{{ user }}"
            mode: "0600"

        # KEEP ignore-free: requires ansible.posix (installed via bootstrap + CI).
        # If firewalld is not running the module fails fast — that's a real error.
        - name: Open KDE Connect ports in firewalld
          ansible.posix.firewalld:
            port: "{{ item }}"
            permanent: true
            immediate: true
            state: enabled
          loop:
            - "1714-1764/tcp"
            - "1714-1764/udp"

        - name: Enable paccache timer for pacman cache cleanup
          ansible.builtin.copy:
            dest: /etc/systemd/system/paccache.service
            content: |
              [Unit]
              Description=Clean pacman cache
              [Service]
              Type=oneshot
              ExecStart=/usr/bin/paccache -r
            mode: "0644"

        - name: Create paccache timer
          ansible.builtin.copy:
            dest: /etc/systemd/system/paccache.timer
            content: |
              [Unit]
              Description=Clean pacman cache weekly
              [Timer]
              OnCalendar=weekly
              Persistent=true
              [Install]
              WantedBy=timers.target
            mode: "0644"

        - name: Enable paccache timer
          systemd:
            name: paccache.timer
            enabled: yes
            state: started
          # AUDIT-KEEP: paccache unit comes from pacman-contrib, absent on
          # minimal fresh installs; the copy tasks above only create the
          # override, not the base unit.
          ignore_errors: yes
      when: not is_wsl

    # ================================================================
    # 10d. SNAPPER (Btrfs snapshots for rollback)
    # ================================================================
    - block:
        # AUDIT-KEEP (x3): snapper + its config only exist on btrfs hosts
        # where snapper was set up at install time; absent elsewhere.
        - name: Enable snapper timeline snapshots
          ansible.builtin.lineinfile:
            path: /etc/snapper/configs/root
            regexp: '^TIMELINE_CREATE='
            line: 'TIMELINE_CREATE="yes"'
          ignore_errors: yes

        - name: Enable snapper timeline timer
          systemd:
            name: snapper-timeline.timer
            enabled: yes
            state: started
          ignore_errors: yes

        - name: Enable snapper cleanup timer
          systemd:
            name: snapper-cleanup.timer
            enabled: yes
            state: started
          ignore_errors: yes

        - name: Make sys-check executable
          ansible.builtin.file:
            path: "/home/{{ user }}/.local/share/chezmoi/scripts/sys-check"
            mode: "0755"
            owner: "{{ user }}"
            group: "{{ user }}"

        - name: Symlink sys-check to PATH
          ansible.builtin.file:
            src: "/home/{{ user }}/.local/share/chezmoi/scripts/sys-check"
            dest: "/home/{{ user }}/.local/bin/sys-check"
            state: link
            owner: "{{ user }}"
            group: "{{ user }}"
            force: yes
      when: not is_wsl

    # ================================================================
    # 10e. HASHICORP VAULT (secrets management)
    # ================================================================
    - block:
        - name: Create vault-unseal service
          ansible.builtin.copy:
            dest: /etc/systemd/system/vault-unseal.service
            content: |
              [Unit]
              Description=Auto-unseal Vault
              After=vault.service
              Wants=vault.service
              [Service]
              Type=oneshot
              User={{ user }}
              Environment=HOME=/home/{{ user }}
              Environment=VAULT_ADDR=http://127.0.0.1:8200
              ExecStart=/home/{{ user }}/.local/share/chezmoi/scripts/vault-unseal.sh
              [Install]
              WantedBy=multi-user.target
            mode: "0644"

        - name: Create vault-unseal timer
          ansible.builtin.copy:
            dest: /etc/systemd/system/vault-unseal.timer
            content: |
              [Unit]
              Description=Unseal Vault after boot
              [Timer]
              OnBootSec=30s
              [Install]
              WantedBy=timers.target
            mode: "0644"

        # AUDIT-KEEP (x2): vault package is not yet in any package layer —
        # only msi-ge66 has it installed manually. TODO: move `vault` into
        # cachyos_packages once the TrueNAS monitoring architecture lands.
        - name: Enable Vault service
          systemd:
            name: vault
            enabled: yes
            daemon_reload: yes
          ignore_errors: yes

        - name: Enable vault-unseal timer
          systemd:
            name: vault-unseal.timer
            enabled: yes
            state: started
            daemon_reload: yes
          ignore_errors: yes

        - name: Make vault scripts executable
          ansible.builtin.file:
            path: "/home/{{ user }}/.local/share/chezmoi/scripts/{{ item }}"
            mode: "0755"
            owner: "{{ user }}"
            group: "{{ user }}"
          loop:
            - vault-init.sh
            - vault-store.sh
            - vault-unseal.sh
      when: not is_wsl

    # ================================================================
    # 10f. VICTORIAMETRICS (monitoring)
    # ================================================================
    - block:
        - name: Create VictoriaMetrics data directory
          ansible.builtin.file:
            path: /var/lib/victoriametrics
            state: directory
            mode: "0755"

        - name: Install VictoriaMetrics from AUR
          kewlfft.aur.aur:
            name: victoriametrics
            use: paru
            state: present
          become: true
          become_user: "{{ user }}"
          ignore_errors: yes
          environment:
            MAKEFLAGS: "-j2"

        - name: Install prometheus-node-exporter
          community.general.pacman:
            name: prometheus-node-exporter
            state: present

        - name: Install alertmanager
          community.general.pacman:
            name: alertmanager
            state: present

        - name: Create alertmanager config directory
          ansible.builtin.file:
            path: /etc/alertmanager
            state: directory
            mode: "0755"

        - name: Deploy alertmanager config
          ansible.builtin.template:
            src: templates/alertmanager.yml.j2
            dest: /etc/alertmanager/alertmanager.yml
            mode: "0644"

        # AUDIT-KEEP: token file only exists after vm-setup.sh runs;
        # stat-guard prevents "file absent" failures on fresh hosts.
        - name: Check telegram token exists
          ansible.builtin.stat:
            path: /etc/alertmanager/telegram-token
          register: telegram_token_stat

        - name: Fix telegram token permissions
          ansible.builtin.file:
            path: /etc/alertmanager/telegram-token
            owner: root
            group: alertmanager
            mode: "0640"
          when: telegram_token_stat.stat.exists

        # TrueNAS is the always-on alert source; local alertmanager stays
        # stopped by default (same on-demand pattern as VM/node-exporter).
        # Start manually for offline testing: systemctl start alertmanager
        - name: Ensure local alertmanager stopped by default
          systemd:
            name: alertmanager
            enabled: no
            state: stopped
          # AUDIT-KEEP: unit absent until first install above on fresh hosts
          ignore_errors: yes

        - name: Create VictoriaMetrics config directory
          ansible.builtin.file:
            path: /etc/victoriametrics
            state: directory
            mode: "0755"

        - name: Create VictoriaMetrics systemd service
          ansible.builtin.copy:
            dest: /etc/systemd/system/victoriametrics.service
            content: |
              [Unit]
              Description=VictoriaMetrics time series database
              After=network.target
              [Service]
              Type=simple
              ExecStart=/usr/bin/victoria-metrics -storageDataPath=/var/lib/victoriametrics -httpListenAddr=:8428 -promscrape.config=/etc/victoriametrics/prometheus.yml -retentionPeriod=30d -storage.minFreeDiskSpaceBytes=1GB -memory.allowedPercent=5
              Restart=always
              RestartSec=30
              [Install]
              WantedBy=multi-user.target
            mode: "0644"

        - name: Deploy VictoriaMetrics scrape config
          ansible.builtin.copy:
            src: files/vm-prometheus.yml
            dest: /etc/victoriametrics/prometheus.yml
            mode: "0644"

        - name: Deploy alert rules
          ansible.builtin.copy:
            src: files/vm-alerts.yml
            dest: /etc/victoriametrics/alerts.yml
            mode: "0644"

        # AUDIT-KEEP (x2): VM/node-exporter units only exist if the AUR/pacman
        # installs above succeeded; intentional stopped+disabled by design
        # (start on demand via sys-monitor).
        - name: Enable VictoriaMetrics
          systemd:
            name: victoriametrics
            enabled: no
            state: stopped
            daemon_reload: yes
          ignore_errors: yes

        - name: Enable node_exporter
          systemd:
            name: prometheus-node-exporter
            enabled: no
            state: stopped
          ignore_errors: yes

        # --- Central monitoring (TrueNAS remote-write) ---
        # Active only when monitoring_remote_write_url is set on the host
        # (host_vars override). vmagent buffers locally when the collector
        # is unreachable — safe for sleeping laptops.
        - name: Deploy vmagent config (central remote-write)
          ansible.builtin.template:
            src: templates/vmagent-conf.yml.j2
            dest: /etc/victoriametrics/vmagent.yml
            mode: "0644"
          when: monitoring_remote_write_url is defined and monitoring_remote_write_url | length > 0

        - name: Create vmagent systemd service
          ansible.builtin.copy:
            dest: /etc/systemd/system/vmagent.service
            content: |
              [Unit]
              Description=vmagent (remote-write to central VictoriaMetrics)
              After=network-online.target
              Wants=network-online.target
              [Service]
              Type=simple
              ExecStart=/usr/bin/vmagent -promscrape.config=/etc/victoriametrics/vmagent.yml -remoteWrite.tmpDataPath=/var/lib/victoriametrics/vmagent-remote-write
              Restart=always
              RestartSec=30
              [Install]
              WantedBy=multi-user.target
            mode: "0644"
          when: monitoring_remote_write_url is defined and monitoring_remote_write_url | length > 0

        - name: Enable vmagent (central remote-write)
          systemd:
            name: vmagent
            enabled: yes
            state: started
            daemon_reload: yes
          when: monitoring_remote_write_url is defined and monitoring_remote_write_url | length > 0
          # AUDIT-KEEP: vmagent binary comes from the victoriametrics AUR pkg
          ignore_errors: yes
      when: not is_wsl

    # ================================================================
    # 10b. CONTAINER INFRASTRUCTURE (native only)
    # ================================================================
    - block:
        - name: Create Docker compose directory
          file:
            path: "/home/{{ user }}/dev/docker"
            state: directory
            mode: "0755"
            owner: "{{ user }}"
            group: "{{ user }}"

        - name: Deploy Portainer compose file
          copy:
            src: files/portainer-compose.yml
            dest: "/home/{{ user }}/dev/docker/portainer-compose.yml"
            mode: "0644"
            owner: "{{ user }}"
            group: "{{ user }}"

        - name: Start Portainer
          community.docker.docker_compose_v2:
            project_src: "/home/{{ user }}/dev/docker"
            files:
              - portainer-compose.yml
            pull: always
          become: true
          become_user: "{{ user }}"
          # AUDIT-KEEP: pulls image over network; fails gracefully offline
          # or when Docker daemon is restarting mid-sync.
          ignore_errors: yes
      when: not is_wsl

    # ================================================================
    # 10g. TAILSCALE (mesh VPN via self-hosted Headscale)
    # ================================================================
    # Package comes from common_packages (Layer 1, all hosts incl. WSL).
    # Enrollment is secret-gated: the pre-auth key lives either at
    # /etc/tailscale/headscale-authkey (0600, like the alertmanager
    # telegram-token pattern) or in the local Vault (secret/vpn/tailscale).
    # Until a key is available the enroll script exits 0 and the timer
    # retries — fresh hosts converge without failing the sync.
    - block:
        - name: Ensure /etc/tailscale exists
          ansible.builtin.file:
            path: /etc/tailscale
            state: directory
            mode: "0750"

        # AUDIT-KEEP: tailscaled unit is shipped by the tailscale package
        # (common_packages) which installs earlier in this same run; absent
        # on fresh hosts until pacman finishes.
        - name: Enable tailscaled
          ansible.builtin.systemd:
            name: tailscaled
            enabled: yes
            state: started
          ignore_errors: yes

        - name: Deploy tailscale enrollment script
          ansible.builtin.copy:
            dest: /usr/local/bin/tailscale-enroll.sh
            mode: "0755"
            content: |
              #!/bin/bash
              # tailscale-enroll — idempotent enrollment against Headscale.
              # Invoked by tailscale-enroll.service (timer-driven). Exits 0
              # when already enrolled or when no auth key is available yet;
              # exits 1 only on a real enrollment failure (timer retries).
              set -uo pipefail

              HEADSCALE_URL="{{ headscale_url | default('https://headscale.wyattau.com') }}"
              KEY_FILE=/etc/tailscale/headscale-authkey
              VAULT_ADDR_LOCAL=http://127.0.0.1:8200
              VAULT_TOKEN_FILE=/home/{{ user }}/.vault-secrets/token

              log() { echo "tailscale-enroll: $*"; }

              command -v tailscale >/dev/null 2>&1 || { log "tailscale not installed"; exit 0; }
              systemctl is-active --quiet tailscaled || { log "tailscaled not running"; exit 0; }

              # BackendState Running/Starting/NeedsMachineAuth = already
              # logged in (NeedsMachineAuth = registered, awaiting approval).
              STATE=$(tailscale status --json 2>/dev/null | grep -o '"BackendState"[^,]*' | head -1)
              if echo "$STATE" | grep -qE 'Running|Starting|NeedsMachineAuth'; then
                  log "already enrolled ($STATE)"
                  exit 0
              fi

              # Auth key: key file first, then local Vault fallback.
              AUTHKEY=""
              if [ -r "$KEY_FILE" ]; then
                  AUTHKEY=$(head -1 "$KEY_FILE" | tr -d '[:space:]')
              elif [ -r "$VAULT_TOKEN_FILE" ] && command -v vault >/dev/null 2>&1; then
                  AUTHKEY=$(VAULT_ADDR="$VAULT_ADDR_LOCAL" \
                            VAULT_TOKEN="$(cat "$VAULT_TOKEN_FILE")" \
                            vault kv get -field=auth_key secret/vpn/tailscale 2>/dev/null || true)
              fi

              if [ -z "$AUTHKEY" ]; then
                  log "no auth key ($KEY_FILE or Vault secret/vpn/tailscale) — skipping"
                  exit 0
              fi

              log "enrolling with $HEADSCALE_URL as $(hostname)"
              if tailscale up \
                  --login-server="$HEADSCALE_URL" \
                  --authkey="$AUTHKEY" \
                  --hostname="$(hostname)" \
                  --accept-routes; then
                  log "enrolled successfully"
                  exit 0
              fi
              log "enrollment failed — retrying on next timer tick"
              exit 1

        - name: Create tailscale-enroll service
          ansible.builtin.copy:
            dest: /etc/systemd/system/tailscale-enroll.service
            content: |
              [Unit]
              Description=Tailscale enrollment (Headscale)
              After=network-online.target tailscaled.service
              Wants=network-online.target
              Requires=tailscaled.service
              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/tailscale-enroll.sh
            mode: "0644"

        - name: Create tailscale-enroll timer
          ansible.builtin.copy:
            dest: /etc/systemd/system/tailscale-enroll.timer
            content: |
              [Unit]
              Description=Retry Tailscale enrollment until it succeeds
              [Timer]
              OnBootSec=2min
              OnUnitActiveSec=1h
              Persistent=true
              [Install]
              WantedBy=timers.target
            mode: "0644"

        - name: Enable tailscale-enroll timer
          ansible.builtin.systemd:
            name: tailscale-enroll.timer
            enabled: yes
            state: started
            daemon_reload: yes

        # AUDIT-KEEP: key file is deployed out-of-band (vault-store.sh or
        # manual copy); stat-guard prevents "file absent" failures on
        # fresh hosts (same pattern as the alertmanager telegram-token).
        - name: Check headscale authkey exists
          ansible.builtin.stat:
            path: /etc/tailscale/headscale-authkey
          register: headscale_key_stat

        - name: Fix headscale authkey permissions
          ansible.builtin.file:
            path: /etc/tailscale/headscale-authkey
            owner: root
            group: root
            mode: "0600"
          when: headscale_key_stat.stat.exists
      when: not is_wsl

    # ================================================================
    # 11. PERFORMANCE TUNING: SYSCTL (native only)
    # ================================================================
    # Always deploy to ensure old overrides are cleared when removed from host_vars.
    - name: Deploy sysctl tuning
      ansible.builtin.template:
        src: templates/99-hft-tuning.conf.j2
        dest: /etc/sysctl.d/99-hft-tuning.conf
        mode: "0644"
      when: not is_wsl
      notify: Reload sysctl

    # ================================================================
    # 12. CPU GOVERNOR: managed by power-profiles-daemon
    # ================================================================
    # cpupower conflicts with power-profiles-daemon. Remove our override
    # so power-profiles-daemon (balanced/performance/power-saver) controls it.
    - name: Remove cpupower governor override (managed by power-profiles-daemon)
      ansible.builtin.file:
        path: /etc/default/cpupower-service.conf
        state: absent
      when:
        - not is_wsl
        - cpu_governor is not defined

    - name: Configure CPU power governor (legacy, if explicitly set)
      ansible.builtin.template:
        src: templates/cpupower.conf.j2
        dest: /etc/default/cpupower-service.conf
        mode: "0644"
      when:
        - not is_wsl
        - cpu_governor is defined

    - name: Enable cpupower service
      systemd:
        name: cpupower
        enabled: yes
        state: started
        daemon_reload: yes
      when:
        - not is_wsl
        - cpu_governor is defined
      # AUDIT-KEEP: cpupower unit absent unless cpupower pkg provides it;
      # legacy path only (power-profiles-daemon is the default now).
      ignore_errors: yes

    # ================================================================
    # 13. PERFORMANCE TUNING: SCX SCHEDULER (native only)
    # ================================================================
    # scx-scheds provides 'scx_loader.service' — a D-Bus on-demand loader.
    # Override to launch with --auto for automatic scheduler selection.
    - block:
        - name: Clean up stale scx.service.d override (if exists)
          file:
            path: /etc/systemd/system/scx.service.d
            state: absent

        - name: Ensure SCX loader override directory exists
          file:
            path: /etc/systemd/system/scx_loader.service.d
            state: directory
            mode: "0755"

        - name: Create SCX loader override
          copy:
            dest: /etc/systemd/system/scx_loader.service.d/override.conf
            content: |
              [Service]
              ExecStart=
              ExecStart=/usr/bin/scx_loader --auto
            mode: "0644"

        - name: Enable SCX scheduler loader
          systemd:
            name: scx_loader
            enabled: yes
            daemon_reload: yes
            # state: started NOT used — scx_loader is Type=dbus (on-demand),
            # systemctl start would hang waiting for the bus name.
      when: not is_wsl

    # ================================================================
    # 14. PERFORMANCE TUNING: NVMe I/O SCHEDULER (native only)
    # ================================================================
    - name: Install NVMe udev scheduler rule
      copy:
        src: templates/60-nvme-scheduler.rules
        dest: /etc/udev/rules.d/60-nvme-scheduler.rules
        mode: "0644"
      when: not is_wsl
      notify: Reload udev

    # ================================================================
    # 15. PERFORMANCE TUNING: KERNEL BOOT PARAMETERS (native only)
    # CachyOS uses Limine (drop-in at /etc/limine-entry-tool.d/)
    # Vanilla Arch uses GRUB (/etc/default/grub)
    # ================================================================

    # --- CachyOS: Limine drop-in ---
    - name: Ensure Limine drop-in directory exists
      ansible.builtin.file:
        path: /etc/limine-entry-tool.d
        state: directory
        mode: "0755"
      when:
        - not is_wsl
        - is_cachyos

    - name: Deploy kernel parameter drop-in (Limine / CachyOS)
      ansible.builtin.template:
        src: templates/99-hft-kernel.conf
        dest: /etc/limine-entry-tool.d/99-hft-kernel.conf
        mode: "0644"
      when:
        - not is_wsl
        - is_cachyos

    - name: Rebuild Limine boot config
      ansible.builtin.command: limine-update
      when:
        - not is_wsl
        - is_cachyos
        - kernel_params is defined
      changed_when: false

    # --- Vanilla Arch: GRUB default cmdline ---
    # Idempotent: strips any existing instances of our params before re-appending.
    # Safe to run on every sys-sync without doubling params.
    - name: Ensure kernel parameters in GRUB config (Arch, idempotent)
      ansible.builtin.shell: |
        CURRENT=$(grep -oP '^GRUB_CMDLINE_LINUX_DEFAULT="\K[^"]+' /etc/default/grub 2>/dev/null || echo "")
        # Remove any of our params that are already present (match by key before =)
        for PARAM in {{ kernel_params | join(' ') }}; do
          KEY="${PARAM%%=*}"
          CURRENT=$(echo "$CURRENT" | sed "s/${KEY}=[^ ]*//g")
        done
        # Trim whitespace, append our params, trim again
        CURRENT=$(echo "$CURRENT" | xargs)
        FINAL="${CURRENT} {{ kernel_params | join(' ') }}"
        FINAL=$(echo "$FINAL" | xargs)
        # Only write if different (idempotent)
        EXISTING=$(grep -oP '^GRUB_CMDLINE_LINUX_DEFAULT="\K[^"]+' /etc/default/grub 2>/dev/null || echo "")
        if [ "$FINAL" != "$EXISTING" ]; then
          sed -i "s|^GRUB_CMDLINE_LINUX_DEFAULT=.*|GRUB_CMDLINE_LINUX_DEFAULT=\"${FINAL}\"|" /etc/default/grub
          echo "CHANGED"
        fi
      register: grub_updated
      changed_when: "'CHANGED' in grub_updated.stdout"
      when:
        - not is_wsl
        - not is_cachyos
        - kernel_params is defined

    - name: Rebuild GRUB config
      ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
      when:
        - not is_wsl
        - not is_cachyos
        - kernel_params is defined
        - grub_updated is changed
      changed_when: false

    # ================================================================
    # 16. PERFORMANCE TUNING: HUGE PAGES (native only)
    # ================================================================
    - name: Configure huge pages via sysctl
      ansible.builtin.sysctl:
        name: vm.nr_hugepages
        value: "{{ (sysctl_tuning.vm['vm.nr_hugepages'] | default(0)) | string }}"
        sysctl_set: yes
        sysctl_file: /etc/sysctl.d/99-hft-tuning.conf
      when:
        - not is_wsl
        - sysctl_tuning is defined
        - sysctl_tuning.vm is defined
        - sysctl_tuning.vm['vm.nr_hugepages'] is defined
        - sysctl_tuning.vm['vm.nr_hugepages'] > 0
      # AUDIT-KEEP (x3, sysctl/hugepages): some kernels/boot states reject
      # hugepage reallocation at runtime; value applies on next boot instead.
      ignore_errors: yes

    # Clear huge pages when not explicitly configured (frees reserved RAM)
    - name: Clear huge pages reservation
      ansible.builtin.sysctl:
        name: vm.nr_hugepages
        value: "0"
        sysctl_set: yes
        sysctl_file: /etc/sysctl.d/99-hft-tuning.conf
      when:
        - not is_wsl
        - sysctl_tuning is not defined
      ignore_errors: yes

    # ================================================================
    # 17. PERFORMANCE TUNING: SECURITY LIMITS (native only)
    # ================================================================
    - block:
        - name: Set performance event paranoid for profiling
          ansible.builtin.sysctl:
            name: kernel.perf_event_paranoid
            value: "{{ (sysctl_tuning.kernel['kernel.perf_event_paranoid'] | default(1)) | string }}"
            sysctl_set: yes
            sysctl_file: /etc/sysctl.d/99-hft-tuning.conf
          when: sysctl_tuning is defined and sysctl_tuning.kernel is defined
          # AUDIT-KEEP: perf_event_paranoid may be locked by lockdown/secure-boot kernels
          ignore_errors: yes

        - name: Set file descriptor limits
          ansible.builtin.template:
            src: templates/99-perf-limits.conf
            dest: /etc/security/limits.d/99-perf-limits.conf
            mode: "0644"
      when: not is_wsl

  # ================================================================
  # HANDLERS
  # ================================================================
  handlers:
    - name: Reload sysctl
      ansible.builtin.shell: sysctl --system
      changed_when: false

    - name: Reload udev
      ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger
      changed_when: false

    - name: Restart nix-daemon
      ansible.builtin.systemd:
        name: nix-daemon
        state: restarted

    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
