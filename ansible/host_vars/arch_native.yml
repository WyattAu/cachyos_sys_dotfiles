# =========================================================================
# LAYER 2: NATIVE LINUX — Installed on ALL bare-metal Linux (Arch + CachyOS)
# Nothing here should conflict with CachyOS repos or defaults.
#
# Split into three profiles:
#   native_packages           — server-safe core (all bare-metal hosts)
#   native_desktop_packages   — desktop/GUI (skipped when is_headless=true)
#   native_gaming_packages    — gaming stack (skipped when is_headless=true)
# Same split applies to the AUR lists below.
# =========================================================================

# --- NATIVE SYSTEM PACKAGES (server-safe) ---
native_packages:
  # System Services & Networking
  - networkmanager
  - network-manager-applet
  - networkmanager-openvpn
  - systemd-resolvconf
  - firewalld
  - wireguard-tools
  - openvpn
  - bluez
  - bluez-utils
  - cups
  - gnome-keyring            # Required by ProtonVPN for credential storage
  - proton-vpn-cli          # Official ProtonVPN CLI (core VPN control)
  - proton-vpn-daemon       # ProtonVPN system daemon (split tunneling service)

  # Sound (base stack)
  - pipewire

  # Virtualization (KVM — unreliable inside WSL2, server-useful)
  - qemu-full
  - virt-manager
  - virt-viewer
  - dnsmasq
  - vde2
  - openbsd-netcat
  - libguestfs

  # System Info & Monitoring
  - hardinfo2
  - nvtop

# --- DESKTOP PACKAGES (skipped on headless hosts) ---
native_desktop_packages:
  # Desktop Environment
  - plasma-meta
  - dolphin
  - ark
  - gwenview
  - okular
  - spectacle

  # Browsers & Media Players
  - firefox
  - firefox-developer-edition
  - brave-bin
  - vlc
  - obs-studio
  - mpv
  - calibre

  # Productivity & Reference
  - libreoffice-fresh
  - hunspell
  - hunspell-en_US
  - rnote
  - zotero                  # Academic paper management

  # Sound (GUI)
  - pavucontrol
  - easyeffects
  - lsp-plugins
  - calf

  # Tools
  - bleachbit
  - kdeconnect
  - filelight
  - gparted
  - element-desktop

# --- GAMING PACKAGES (skipped on headless hosts) ---
native_gaming_packages:
  - steam
  - lutris
  - heroic-games-launcher   # Epic + GOG in one app
  - gamemode
  - lib32-gamemode
  - mangohud
  - lib32-mangohud
  - gamescope
  - wine
  - winetricks
  - retroarch               # Unified emulation frontend

# --- NATIVE AUR: CORE (server-safe) ---
native_aur_pkgs:
  # Android
  - android-udev             # Android device udev rules

# --- NATIVE AUR: DESKTOP (skipped on headless hosts) ---
native_desktop_aur_pkgs:
  # KDE Integration
  - ksshaskpass

  # Browsers
  - floorp-bin
  - zen-browser-bin
  - tor-browser-bin

  # Chat
  - vesktop-bin
  - signal-desktop
  - telegram-desktop
  - betterbird-bin

  # Media
  - freetube-bin

  # Sync & Safety
  - owncloud-client         # Desktop sync to OCIS (ocis.wyattau.com)
  - pika-backup
  - visual-studio-code-bin

  # VPN
  - proton-vpn-qt-app       # Qt GUI frontend for ProtonVPN CLI (KDE-native)

# --- NATIVE AUR: GAMING (skipped on headless hosts) ---
native_gaming_aur_pkgs:
  - protonup-qt
  - steam-rom-manager       # Manage ROMs for Steam

# --- NATIVE SERVICES (started on all bare-metal hosts) ---
native_services:
  - NetworkManager
  - firewalld
  - docker
  - fstrim.timer
  - irqbalance
  - bluetooth
  - cups
