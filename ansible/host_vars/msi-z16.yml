# =========================================================================
# HOST: msi-z16 — MSI Creator Z16 Laptop
# =========================================================================
# Hardware: AMD Ryzen (scx-scheds), NVIDIA + iGPU hybrid, MSI EC
# Distro:   CachyOS (was Vanilla Arch, reinstalled)
# Layers:   common.yml → arch_native.yml → cachyos.yml → THIS FILE

# --- Host Type ---
is_laptop: true

# --- Hardware Drivers & Peripherals ---
# NOTE: CachyOS provides NVIDIA via linux-cachyos-lts-nvidia-open (managed by
# the kernel metapackage). Do NOT add nvidia-open-dkms here — it conflicts.
host_packages:
  - nvidia-utils
  - nvidia-settings
  - libva-nvidia-driver
  - vulkan-tools
  - sof-firmware
  - alsa-tools
  - libfprint
  - fprintd
  - python-hidapi
  - python-setuptools
  - blender

host_aur_pkgs:
  - envycontrol
  - mcontrolcenter-git
  - msi-ec-dkms-git
  - whitesur-icon-theme-git
  - openrgb-git
  - msi-perkeyrgb

# --- Services ---
host_services:
  - msi-audio.service
  - libvirtd

masked_services:
  - packagekit.service

# --- Kernel Modules ---
# msi_wmi conflicts with msi-ec on Creator Z16 — blacklist it so msi-ec
# can handle Fn keys (brightness, RGB, fan mode, etc.)
blacklisted_modules:
  - msi_wmi
  - msi_wmi_platform

# msi-ec provides MSI Embedded Controller support (fan control, Fn keys,
# battery thresholds). Must be loaded early for Fn+F5 (RGB) to work.
loaded_modules:
  - msi-ec

# =========================================================================
# PERFORMANCE TUNING
# =========================================================================

# CPU governor: managed by power-profiles-daemon (balanced by default).
# Use 'powerprofilesctl set performance' when plugged in.

# GPU: defaults to NVIDIA via envycontrol.
# After first sys-sync, run: envycontrol -s nvidia && reboot
# Switch to iGPU for battery: envycontrol -s integrated && reboot

# --- Kernel Boot Parameters ---
# Only hardware-specific params — no HFT-inspired tuning.
kernel_params:
  - "amdgpu.ppfeaturemask=0xffffffff"    # Unlock AMD power tuning
  - "ibt=off"                            # Disable Indirect Branch Tracking (perf)

# --- Sysctl Tuning ---
# Removed — Arch defaults are fine for laptop use.
