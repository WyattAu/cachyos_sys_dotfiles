[General]
# Minecraft optimization — managed by chezmoi (sys-sync overwrites GUI edits)
# Memory: 32GB host — 8GB heap is the modded sweet spot (larger heaps slow ZGC)
MinMemAlloc=2048
MaxMemAlloc=8192

# Generational ZGC: near-zero GC pauses. LargePages: THP is [always] on CachyOS,
# so 2MB pages reduce TLB misses. AlwaysPreTouch commits heap upfront.
JvmArgs=-XX:+UseZGC -XX:+ZGenerational -XX:+AlwaysPreTouch -XX:+UseNUMA -XX:+UseLargePages -XX:LargePageSizeInBytes=2m -XX:-OmitStackTraceInFastThrow -XX:+UnlockExperimentalVMOptions -XX:+OptimizeStringConcat

# GameMode: CachyOS governor switch. MangoHud: FPS overlay.
# PipeWire latency: 128 samples/48kHz kills OpenAL crackling.
WrapperCommand=PIPEWIRE_LATENCY="128/48000" gamemoderun mangohud

# Native Wayland GLFW (kills XWayland input lag)
UseNativeGLFW=true
NativeGLFWPath=/usr/lib/libglfw.so
