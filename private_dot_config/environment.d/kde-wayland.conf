# Qt/Wayland integration — deployed by chezmoi
# Fixes Qt apps falling back to X11, GTK apps not using Wayland, portal dialogs
QT_QPA_PLATFORMTHEME=wayland
QT_AUTO_SCREEN_SCALE_FACTOR=1
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
GDK_BACKEND=wayland
XDG_CURRENT_DESKTOP=KDE
XDG_SESSION_DESKTOP=KDE
# Firefox/LibreWolf Wayland
MOZ_ENABLE_WAYLAND=1
# GTK4 rendering
GSK_RENDERER=ngl
