# Block apps with automatic gain control from changing microphone volume.
#
# Targeted list — system mixers (pavucontrol, KDE audio widget, wpctl) are
# NOT matched, so mic volume remains user-adjustable from the GUI.
#
# Blocked: browsers (WebRTC AGC), Discord/vesktop, Zoom, Teams, Slack.
# Add offenders by extending the regexes below.
# Toggle with: mic-lock on|off|status  (sys-sync re-enables this file)
pulse.rules = [
    {
        # Voice/video apps with AGC
        matches = [
            { application.process.binary = "~^(Discord|discord|vesktop|electron|WebCord|zoom|Zoom|teams|teams-for-linux|teams-insiders|skypeforlinux|Slack|slack)$" }
        ]
        actions = { quirks = [ block-source-volume ] }
    }
    {
        # Browsers — WebRTC automatic gain control.
        # Also keeps stock firefox quirk (remove-capture-dont-move).
        matches = [
            { application.process.binary = "~^(firefox.*|librewolf|floorp|zen-browser|zen|firedragon|waterfox.*|tor-browser|chromium|chrome|brave|msedge|vivaldi|opera|thorium).*$" }
        ]
        actions = { quirks = [ remove-capture-dont-move, block-source-volume ] }
    }
]
