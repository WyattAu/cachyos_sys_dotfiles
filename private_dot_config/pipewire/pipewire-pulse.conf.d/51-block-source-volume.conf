# Block applications (Discord, Chrome, Firefox, Zoom...) from changing
# microphone volume via the PulseAudio protocol.
#
# System-level control still works: wpctl and `mic-lock` talk to PipeWire
# natively. Note: pavucontrol/Plasma audio widget use the pulse protocol
# and are blocked too — use wpctl or `mic-lock set 80%` instead.
#
# Toggle with: mic-lock on|off|status  (sys-sync re-enables this file)
pulse.rules = [
    {
        matches = [
            {
                # Regex matches every client binary
                application.process.binary = "~.*"
            }
        ]
        actions = { quirks = [ block-source-volume ] }
    }
]
