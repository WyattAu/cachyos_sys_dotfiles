# Workaround: Chromium's Wayland color-management protocol (wp_color_manager_v1)
# races frame commits on KDE Wayland -> flickering / washed-out colors.
# Upstream tracking: https://github.com/brave/brave-browser/issues/50027
# Remove once the upstream Chromium CLs land in a Brave release.
--disable-features=WaylandWpColorManagerV1
# Panel is SDR/sRGB; pinning the profile covers the washed-out variant.
--force-color-profile=srgb
